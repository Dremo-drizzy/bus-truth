name: CI

# Every push on any branch, and every pull request into main. The PR trigger is
# what lets a branch be judged before it is merged, not after.
on:
  push:
  pull_request:
    branches: [main]

# The job only reads the repository. Narrowing the token means a compromised
# action in the build cannot push commits or publish releases.
permissions:
  contents: read

# A second push to the same branch cancels the first run still in progress:
# the older result is already out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # A clean Linux machine every run — the point of CI: it has none of the
    # state your laptop has accumulated.
    runs-on: ubuntu-latest

    steps:
      # Clones the repo at the commit that triggered the run.
      - name: Check out the repository
        uses: actions/checkout@v7

      # Installs the JDK. Temurin 21 matches java.version in the root pom, so CI
      # compiles against the same API as your machine.
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.m2/repository between runs, keyed on the pom files. Without
          # it every run re-downloads Spring Boot's whole dependency tree.
          cache: 'maven'

      # The wrapper, not a preinstalled mvn: it pins the Maven version from
      # .mvn/wrapper/maven-wrapper.properties, so CI and your laptop agree.
      # mvnw is committed with its executable bit set (100755), which is why
      # ./mvnw runs here directly.
      # -B is batch mode: no ANSI colours or progress spinners, so the log stays
      # readable. verify compiles, runs the tests and packages each module.
      - name: Build and test
        run: ./mvnw -B verify

  web:
    name: Build the web app
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Node 24, matching local development. cache: npm keys on the lockfile, so a
      # run only re-downloads when dependencies actually change.
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # npm ci, not npm install: it installs exactly the committed lockfile and fails
      # if package.json and the lockfile disagree, so CI cannot quietly build against
      # different versions than a developer has.
      - name: Install dependencies
        run: npm ci
        working-directory: web

      # npm run build is `tsc --noEmit && vite build`: vite does not type-check on its
      # own, unlike the next build this replaced, so the type-check is spelled out.
      # Without it a TypeScript error would be discovered by someone opening the page.
      - name: Build
        run: npm run build
        working-directory: web

      # Chromium only. The suite checks rendering, console errors and layout width,
      # none of which needs three engines, and each extra browser is a download and a
      # third more wall-clock on every push.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: web

      # Loads all five pages in a real browser at 1280px and 400px, and fails on a
      # console error, a failed request, a page stuck loading, or any horizontal
      # overflow. This replaced a caveat: R7 shipped saying the pages had not been
      # opened in a browser, so rendering and the no-sideways-scroll requirement were
      # unverified. The API is served from responses captured against the real
      # database, so no PostgreSQL is needed here.
      - name: Smoke-test the pages
        run: npm run test:e2e
        working-directory: web

      # The screenshots are the point of a failure: "it overflows at 400px" is an
      # argument, a picture of it overflowing is not.
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-screenshots
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
