spring:
  application:
    name: processor

  datasource:
    # Host and port are variables with local defaults; see the collector's config.
    # 55432, not 5432: native PostgreSQL services on this machine own 5432.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:55432}/${POSTGRES_DB:bustruth}
    username: ${POSTGRES_USER:bustruth}
    # No default, deliberately.
    password: ${POSTGRES_PASSWORD}

  # The collector owns the schema; the processor reads and writes its tables.
  flyway:
    enabled: false

server:
  port: 8083

bustruth:
  processor:
    # NEEDS DANIEL'S REVIEW — the four judgement calls, at the build brief's suggested
    # values. These decide what the project publishes.
    #
    # The feed holds one stop sequence for minutes, so each stop is reported as a
    # WINDOW of positions. LAST_BEFORE_ADVANCE takes that window's end,
    # FIRST_SIGHTING its start, and the choice is worth 21 percentage points on the
    # headline figure. Settled by measurement: against the windows where the agency
    # itself reports STOPPED_AT, the end is a median 61s late and the start a median
    # 544s early (ADR-014). Keep this in step with DetectionSettings.defaults().
    arrival-moment: LAST_BEFORE_ADVANCE
    on-time-early: -60s
    on-time-late: 300s
    # Mandatory. Coverage was 73.7% overall and 42.4% on the worst day because the
    # laptop slept; across a sleep a bus's sequence appears to jump, which is
    # indistinguishable from skipped stops. Deriving across it would publish invented
    # service.
    max-trail-gap: 120s
