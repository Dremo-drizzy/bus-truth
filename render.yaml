# Bus Truth on Render — create everything from this file.
#
#   Render dashboard → New → Blueprint → pick this repository → Apply
#
# It declares three things and nothing else: the site, the API, and a Postgres
# database. There is deliberately no collector, no loader, no cron job and no
# persistent disk, because nothing in the cloud writes to data/ — the archive lives on
# Daniel's machine and the cloud only ever reads a copy of the derived tables.
#
# Two consequences of that worth knowing before you apply it:
#
#   1. The database starts EMPTY and the API cannot create its own schema (Flyway
#      belongs to the collector, which is not deployed). The schema and the figures
#      both arrive with the one-time restore in docs/DEPLOY.md, step 4. Until then the
#      API will start and its endpoints will return errors or empty results.
#
#   2. A Render FREE Postgres EXPIRES 30 DAYS AFTER CREATION, with a 14-day grace
#      period to upgrade before Render deletes it and everything in it. Nothing here
#      is irreplaceable — every table can be rebuilt from the local archive by
#      replaying it — but the site goes down when it expires. Diarise it. ADR-016 has
#      the detail.
#
# No secret appears in this file. The database's credentials are injected by Render
# from the database it creates; anything else secret is declared `sync: false`, which
# makes Render prompt for it once at creation.

databases:
  - name: bus-truth-db
    databaseName: bustruth
    user: bustruth
    plan: free
    # Virginia: this is a Halifax transit site for Canadian viewers, and Virginia is
    # the closest region Render offers — about 1,100 km away against 6,000 for
    # Frankfurt. The database and the API share this region so that the API reaches the
    # database over Render's private network rather than the public internet. The static
    # site has no region because it is served from the CDN.
    region: virginia

services:
  # ---------------------------------------------------------------------------------
  # The API. Built from the Dockerfile the project already had, so what runs in the
  # cloud is the image that was built and smoke-tested locally.
  # ---------------------------------------------------------------------------------
  - type: web
    name: bus-truth-api
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./infra/api.Dockerfile
    # The repo root, because the api module depends on common and Maven needs the
    # whole reactor.
    dockerContext: .
    # LIVENESS ONLY, and the path matters more than it looks.
    #
    # /actuator/health includes a database health indicator, so with an empty or
    # unreachable database it answers HTTP 503 DOWN — measured, not assumed. Render
    # would then mark every deploy unhealthy and restart the service in a loop, which
    # sits between you and the one-time restore that would have fixed it. A health
    # check that fails when a dependency is down produces cascading restarts instead
    # of signal.
    #
    # /actuator/health/liveness answers 200 UP in the same state: the process is up
    # and serving.
    #
    # Measured, because the obvious assumption is wrong: /actuator/health/readiness
    # ALSO answers 200 UP with no database. Both probe groups contain only Spring's
    # own state indicators, and the datasource indicator sits in the root health group
    # alone. So /actuator/health is the one to curl when you want to know whether the
    # database is reachable — it is just not the one to hand a platform that restarts
    # on failure.
    healthCheckPath: /actuator/health/liveness
    envVars:
      # ---- the JVM inside a 512 MB container -------------------------------------
      # Capped explicitly. Left to itself a modern JVM takes a quarter of what it
      # believes the machine has, which on a shared host can be read as far more than
      # 512 MB; the container is then killed for exceeding memory and Render reports a
      # crash loop with nothing in the application log to explain it.
      #
      # 70% of 512 MB is about 358 MB of heap, leaving room for metaspace, thread
      # stacks, code cache and the direct buffers the PostgreSQL driver uses.
      # SerialGC because one small heap on one or two cores does not benefit from a
      # concurrent collector and G1's own bookkeeping is real memory.
      - key: JAVA_TOOL_OPTIONS
        value: >-
          -XX:MaxRAMPercentage=70
          -XX:+UseSerialGC
          -XX:MaxMetaspaceSize=128m
          -Xss512k
          -XX:+ExitOnOutOfMemoryError

      # ---- the database ----------------------------------------------------------
      # The whole connection string, from the database Render creates above. It is the
      # INTERNAL one: services in the same region reach the database privately, and it
      # is never typed anywhere.
      #
      # It arrives as postgres://user:password@host:5432/database, which JDBC cannot
      # use, so ApiApplication translates it at startup (see DatabaseUrl). A Blueprint
      # cannot inject a database's host or port — only the connection string, user,
      # password and database name — and the internal hostname is generated when the
      # database is created, so assembling a JDBC URL from parts in this file is not
      # possible.
      - key: DATABASE_URL
        fromDatabase:
          name: bus-truth-db
          property: connectionString

      # Also injected individually, because the application's own defaults are built
      # from these and it is clearer in the logs which database it reached.
      - key: POSTGRES_DB
        fromDatabase:
          name: bus-truth-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: bus-truth-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: bus-truth-db
          property: password

      # ---- the rest --------------------------------------------------------------
      # The API never migrates; the collector owns the schema and is not deployed, so
      # the schema arrives with the restore. Stated here as well as in application.yml
      # so that it cannot be turned on by accident in the dashboard.
      - key: SPRING_FLYWAY_ENABLED
        value: "false"

      # No collector writes to this database, so there is no live feed to serve.
      # Off, /api/vehicles/live answers 503 with a problem document saying so, instead
      # of reading raw_vehicle_positions — a table this deployment deliberately does
      # not hold. Not an empty list: that would claim there are no buses. The map uses
      # /api/vehicles/snapshot here instead. Defaults to true everywhere else.
      - key: BUSTRUTH_API_LIVE_FEED_ENABLED
        value: "false"

      # Which origin may call this API from a browser. One origin, never a wildcard
      # (see WebOriginConfig).
      #
      # A LITERAL, and it has to be. This was wired with `fromService: property: host`,
      # which returns Render's INTERNAL networking name — "bus-truth-web", with no
      # domain. That is the address one service uses to reach another privately; it is
      # not what a browser sends. So the allow-list held "bus-truth-web" while real
      # browsers sent "Origin: https://bus-truth-web.onrender.com", every request was
      # refused, and the page reported the API as unreachable.
      #
      # Render has no Blueprint property for a service's PUBLIC url, so there is
      # nothing to reference — the value is written out. It is a public hostname, not a
      # secret, so it belongs in the file. No trailing slash: the header is compared as
      # a literal string.
      - key: BUSTRUTH_API_WEB_ORIGIN
        value: https://bus-truth-web.onrender.com

  # ---------------------------------------------------------------------------------
  # The site. A static build, so there is no server to pay for and nothing to patch.
  # ---------------------------------------------------------------------------------
  - type: web
    name: bus-truth-web
    runtime: static
    # No region, deliberately: Render serves static sites from its CDN, so they have
    # no region to set and the Blueprint validator rejects the key outright. Do not add
    # it back. The latency argument below belongs to the API and the database, which do
    # have regions and must share one.
    #
    # Everything frontend lives in web/, so Render builds from there and the paths
    # below are relative to it.
    rootDir: web
    # npm ci, not install: it installs exactly the committed lockfile and fails if the
    # lockfile and package.json disagree. `npm run build` is `tsc --noEmit && vite
    # build`, so a type error fails the deploy rather than reaching a visitor.
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # The API's public origin, baked into the bundle at build time.
      #
      # A LITERAL, for the same reason as BUSTRUTH_API_WEB_ORIGIN above and with the
      # same symptom seen live: wired with `fromService: property: host` this became
      # "bus-truth-api", Render's internal networking name. The browser then tried
      # https://bus-truth-api/api/coverage, a hostname that does not exist on the
      # public internet, and the fetch failed before leaving the machine — "Failed to
      # fetch" rather than any HTTP status.
      #
      # `property: host` is for service-to-service calls inside Render and must never
      # be used for a value a browser sees. There is no Blueprint property for the
      # public url, so this is written out.
      #
      # Unset, the site would fetch /api/... from its own origin and 404 against the
      # static host — which is the failure this variable exists to prevent.
      - key: VITE_API_BASE_URL
        value: https://bus-truth-api.onrender.com

      # The map shows one named minute rather than watching a live feed, because
      # nothing collects positions for this deployment: the restore carries the derived
      # tables and a single curated minute, not the 1.4 million raw positions. Without
      # this the map would answer empty for ever and show its "no recent data" notice,
      # which is honest and reads as broken on the most visually compelling page here.
      #
      # It never pretends to be live: a separate endpoint, a separate response type
      # with no freshness fields, and the page labels itself "Tuesday 6 October 2026,
      # 17:08". Unset means live, which is what local development wants.
      - key: VITE_MAP_MODE
        value: snapshot
    routes:
      # THE REWRITE THAT MATTERS. React Router owns the paths: /routes/14 and
      # /stops/8640 are client-side routes with no file behind them. Without this,
      # opening or refreshing one of those URLs — or following a shared link — returns
      # the static host's 404, while the identical page reached by clicking works
      # perfectly. It is the single most common mistake when putting a Vite app on a
      # static host, and it only ever shows up after someone shares a link.
      #
      # Last rule, so real files (/assets/*, /favicon.ico) are served first and only
      # unmatched paths fall through to the app shell.
      - type: rewrite
        source: /*
        destination: /index.html
