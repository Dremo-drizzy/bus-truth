# Serves the built site and proxies the API from the same origin.
#
# Same-origin matters: the frontend fetches "/api/..." with no host, exactly as it
# does behind the Vite dev proxy, so there is no CORS configuration anywhere in the
# project and no difference between development and production to get wrong.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # React Router owns the paths. /routes/14 is a client route with no file behind
    # it, so anything that is not a real file falls back to the app shell — without
    # this, a shared link to a route page 404s while the same page reached by
    # clicking works, which is a maddening bug to be told about rather than see.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed assets never change under the same name, so they can be cached
    # for a year. index.html must not be, or a deploy leaves browsers on the old app.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        # The service name on the compose network. The api is not published to the
        # host at all in production: this is the only way in.
        proxy_pass http://api:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
